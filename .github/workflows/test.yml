name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Chromium + the system libraries it needs on a fresh runner.
      - run: npx playwright-core install --with-deps chromium

      - run: npm test

      - name: Build ZIP (sanity check)
        run: npm run build
